<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Flask POST</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="container">
    <h1>Form Parsing POST</h1>

    <form method="POST" action="/">
      <label for="nama">Masukkan Nama / Teks:</label>
      <input
        type="text"
        id="nama"
        name="nama"
        placeholder="Ketik sesuatu di sini..."
        value="{{ nama }}"
        required
      />
      <button type="submit">Kirim</button>
    </form>

    {% if hasil %}
      <p class="output">{{ hasil }}</p>
    {% endif %}
  </main>
</body>
</html>
